name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Public repository that holds the releases and that the app's updater reads; this source repository can be private.
  RELEASE_REPOSITORY: HaiTrieu247/MacExtend

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: uxplay runtime (MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav

      - name: Build uxplay
        run: bash native/build-uxplay.sh

      - name: Bundle uxplay with its GStreamer plugins and DLLs
        run: bash native/bundle-runtime.sh

      - name: Verify the bundle runs without MSYS2
        shell: pwsh
        run: ./native/verify-bundle.ps1 -Bundle dist/uxplay

      - uses: actions/upload-artifact@v4
        with:
          name: uxplay-runtime
          path: dist/uxplay
          if-no-files-found: error
          retention-days: 1

  # Python 3.13 + the locked pymobiledevice3 for "Điều khiển trực tiếp", downloaded by the app on first use
  # (never in the installer or the portable zip). Built and checked on a relocated copy.
  coredevice-runtime:
    name: CoreDevice runtime (Python 3.13 + pymobiledevice3)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.13'
          architecture: x64

      - name: Build runtime
        shell: pwsh
        run: ./tools/coredevice/build-runtime.ps1 -Python '${{ steps.python.outputs.python-path }}' -Out build/coredevice-runtime

      - name: Verify runtime (relocated copy)
        shell: pwsh
        run: ./tools/coredevice/verify-runtime.ps1 -Runtime build/coredevice-runtime

      - uses: actions/upload-artifact@v4
        with:
          name: coredevice-runtime
          path: build/coredevice-runtime
          if-no-files-found: error
          retention-days: 1

  app:
    name: MacExtend app, tests and packages
    needs: [runtime, coredevice-runtime]
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          # tag vX.Y.Z builds X.Y.Z; every other build is <version.txt>.<run number>, always increasing.
          # A tag with a suffix (v1.0.8-beta.1) is a pre-release: the app, installer and update.ini carry the
          # number (1.0.8), file names and the release carry the whole label.
          $prefix = (Get-Content version.txt -Raw).Trim()
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "$prefix.$env:GITHUB_RUN_NUMBER" }
          $number = ($v -split '-', 2)[0]
          if ($number -notmatch '^\d+\.\d+\.\d+$') { throw "version '$v' must start with X.Y.Z" }
          "value=$v" >> $env:GITHUB_OUTPUT
          "number=$number" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($v -ne $number) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          name: coredevice-runtime
          path: build/coredevice-runtime

      - name: CoreDevice runtime zip
        id: coredevice
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = "dist/MacExtend-${{ steps.version.outputs.value }}-coredevice-runtime.zip"
          7z a -tzip $zip ./build/coredevice-runtime/* | Out-Null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $item = Get-Item $zip
          "file=$($item.Name)" >> $env:GITHUB_OUTPUT
          "sha256=$((Get-FileHash $item -Algorithm SHA256).Hash.ToLower())" >> $env:GITHUB_OUTPUT
          "size=$($item.Length)" >> $env:GITHUB_OUTPUT
          "id=$((Get-Content build/coredevice-runtime/RUNTIME_ID -Raw).Trim())" >> $env:GITHUB_OUTPUT

      - name: Unit tests
        run: dotnet test tests/MacExtend.Core.Tests -c Release

      - name: Build app
        run: dotnet build src/MacExtend.App -c Release -o build/MacExtend -p:Version=${{ steps.version.outputs.number }} -p:InformationalVersion=${{ steps.version.outputs.value }} -p:UpdateRepository=${{ env.RELEASE_REPOSITORY }} -p:DebugType=none -p:CoreDeviceRuntimeId=${{ steps.coredevice.outputs.id }} -p:CoreDeviceRuntimeFile=${{ steps.coredevice.outputs.file }} -p:CoreDeviceRuntimeSha256=${{ steps.coredevice.outputs.sha256 }} -p:CoreDeviceRuntimeSize=${{ steps.coredevice.outputs.size }}

      - uses: actions/download-artifact@v4
        with:
          name: uxplay-runtime
          path: build/MacExtend/uxplay

      # Elevated pieces for real on the admin runner: the helper modes, the firewall rules, the Scheduled Task and the
      # task's own tunneld command line (no iPhone needed). It works on temporary copies of build/MacExtend, so the
      # portable zip below is not affected.
      # The registered Scheduled Task is started for real here (Start-ScheduledTask, then GET / == {}); this is the only
      # step that proves the task's Execute/Arguments/WorkingDirectory/principal actually launch tunneld, and that setup
      # replaces and remove ends a tunneld the task is running. It fails if the runner cannot run the Interactive task;
      # a local run may skip it with MACEXTEND_CI_ALLOW_TASK_SKIP=1 (deliberately not set here).
      - name: CoreDevice setup, task and tunneld (elevated runner)
        shell: pwsh
        timeout-minutes: 20
        run: ./tools/coredevice/test-setup.ps1 -App build/MacExtend -Zip "dist/${{ steps.coredevice.outputs.file }}" -RuntimeId "${{ steps.coredevice.outputs.id }}"

      - name: Portable zip
        shell: pwsh
        run: |
          Copy-Item LICENSE, README.md build/MacExtend/
          New-Item -ItemType Directory -Force dist | Out-Null
          7z a -tzip "dist/MacExtend-${{ steps.version.outputs.value }}-portable.zip" ./build/MacExtend | Out-Null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Update packages (app zip, runtime zip, update.ini)
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.value }}'
          Remove-Item build/app-only -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item build/MacExtend build/app-only -Recurse
          Remove-Item build/app-only/uxplay -Recurse -Force
          7z a -tzip "dist/MacExtend-$v-app.zip" ./build/app-only/* | Out-Null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          7z a -tzip "dist/MacExtend-$v-runtime.zip" ./build/MacExtend/uxplay/* | Out-Null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $app = Get-Item "dist/MacExtend-$v-app.zip"
          $runtime = Get-Item "dist/MacExtend-$v-runtime.zip"
          $runtimeId = (Get-Content build/MacExtend/uxplay/RUNTIME_ID -Raw).Trim()
          $lines = @(
            '# MacExtend update manifest'
            "version=${{ steps.version.outputs.number }}"
            "app.file=$($app.Name)"
            "app.sha256=$((Get-FileHash $app -Algorithm SHA256).Hash.ToLower())"
            "app.size=$($app.Length)"
            "runtime.id=$runtimeId"
            "runtime.file=$($runtime.Name)"
            "runtime.sha256=$((Get-FileHash $runtime -Algorithm SHA256).Hash.ToLower())"
            "runtime.size=$($runtime.Length)"
            "coredevice.id=${{ steps.coredevice.outputs.id }}"
            "coredevice.file=${{ steps.coredevice.outputs.file }}"
            "coredevice.sha256=${{ steps.coredevice.outputs.sha256 }}"
            "coredevice.size=${{ steps.coredevice.outputs.size }}"
          )
          [IO.File]::WriteAllText("$PWD/dist/update.ini", ($lines -join "`n") + "`n")
          Get-Content dist/update.ini

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ steps.version.outputs.number }}" "/DAppLabel=${{ steps.version.outputs.value }}" "/DSourceDir=$PWD\build\MacExtend" "/O$PWD\dist" installer\MacExtend.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Installer and uninstaller (elevated runner)
        shell: pwsh
        timeout-minutes: 20
        run: ./tools/coredevice/test-uninstall.ps1 -Setup "dist/MacExtend-${{ steps.version.outputs.value }}-setup.exe" -Zip "dist/${{ steps.coredevice.outputs.file }}"

      - uses: actions/upload-artifact@v4
        with:
          name: MacExtend-${{ steps.version.outputs.value }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  # Experimental CoreDevice probe (tools/coredevice/README.md): a separate console tool, never part of the app,
  # its packages or the release. Needs neither the uxplay runtime nor a device: the smoke tests use a fake
  # serve-web on the packaged CoreDevice runtime.
  coredevice-probe:
    name: CoreDevice probe (experimental, not shipped)
    needs: coredevice-runtime
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: coredevice-runtime
          path: build/coredevice-runtime

      - name: Unit tests
        run: dotnet test tests/MacExtend.Core.Tests -c Release

      - name: Build solution
        run: dotnet build MacExtend.sln -c Release

      - name: Build probe
        run: dotnet build tools/MacExtend.CoreDeviceProbe -c Release -o build/coredevice-probe/bin -p:DebugType=none

      - name: Smoke tests (net48 probe, relocated runtime, fake serve-web)
        shell: pwsh
        run: ./tools/coredevice/verify-runtime.ps1 -Runtime build/coredevice-runtime -Probe build/coredevice-probe/bin/MacExtend.CoreDeviceProbe.exe

      - name: Package
        id: package
        shell: pwsh
        run: |
          $dir = 'build/coredevice-probe'
          Copy-Item tools/coredevice/setup.ps1, tools/coredevice/compile-lock.ps1, tools/coredevice/requirements.in, tools/coredevice/requirements-win-x64-py313.lock.txt, tools/coredevice/README.md $dir
          "name=coredevice-probe-$($env:GITHUB_SHA.Substring(0, 7))" >> $env:GITHUB_OUTPUT

      # deliberately not MacExtend-*: the release job collects artifacts by that pattern
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: build/coredevice-probe
          if-no-files-found: error

  # Every push to main (and every v* tag) becomes a release in RELEASE_REPOSITORY, so the app's updater can find it.
  # A tag with a suffix (v1.0.8-beta.1) becomes a pre-release: never Latest, so the updater, which reads only the
  # latest release, does not offer it to anyone.
  # Publishing there needs the secret RELEASES_TOKEN: a fine-grained token with Contents read and write on that
  # repository only (GITHUB_TOKEN can write to this repository alone).
  release:
    name: GitHub release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: app
    runs-on: ubuntu-latest
    steps:
      - name: Check the release token
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error::Secret RELEASES_TOKEN is missing: a fine-grained token with Contents read and write on $RELEASE_REPOSITORY"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: MacExtend-*
          path: dist
          merge-multiple: true

      # no target_commitish: this run's commit is not in that repository, so the tag goes on its default branch
      - name: Release in ${{ env.RELEASE_REPOSITORY }}
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASE_REPOSITORY }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v${{ needs.app.outputs.version }}
          name: MacExtend ${{ needs.app.outputs.version }}
          body: |
            Cài mới: tải `MacExtend-${{ needs.app.outputs.version }}-setup.exe`, hoặc `MacExtend-${{ needs.app.outputs.version }}-portable.zip` để chạy không cần cài.
            Máy đã cài MacExtend tự nhận bản này, hoặc bấm **Kiểm tra cập nhật** trong app. Các file còn lại là gói cập nhật app dùng.
          prerelease: ${{ needs.app.outputs.prerelease }}
          make_latest: ${{ needs.app.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: dist/*

  # A private repository gets 500 MB of artifact storage, billed by the hour, and one run uploads about 500 MB.
  # Once the release holds the files, this run's artifacts are not needed; the small CoreDevice probe stays.
  # Runs without a release (pull requests) keep theirs for a day (retention-days on each upload).
  cleanup:
    name: Delete this run's artifacts
    needs: [release, coredevice-probe]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete artifacts except the CoreDevice probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("coredevice-probe-") | not) | .id' |
          while read -r id; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done
